# Documentation site. Preview: `zensical serve`. Build: `zensical build` (writes site/).
# Published to GitHub Pages on each release tag by .github/workflows/docs.yml.

[project]
site_name = "cf-lab"
site_description = "Crazyflie 2.1 Brushless + AI-deck research SDK"
site_url = "https://illinoisreliableautonomygroup.github.io/Crazyflie-Lab/"
repo_url = "https://github.com/IllinoisReliableAutonomyGroup/Crazyflie-Lab"
repo_name = "IllinoisReliableAutonomyGroup/Crazyflie-Lab"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Your own project" = "your-project.md" },
  { "Where to look" = "where-to-look.md" },
  { "Commands" = "commands.md" },
  { "Safety" = "safety.md" },
  { "Writing docs" = "writing-docs.md" },
]
# LaTeX: $...$ inline, $$...$$ display (pymdownx.arithmatex below + MathJax).
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
