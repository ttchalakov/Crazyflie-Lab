# nn_bench sets. See ../README.md.
#
# Each entry runs its networks on its DORY memory models with its runners:
#   networks  groups or names from host/networks.py
#   inputs    for the camera networks (listed without one): 160x120c1, 320x240c1; default both
#   memory    l2 (weights linked into L2) or l3 (weights in flash, staged through HyperRAM)
#   runners   pulp_nn (DORY with PULP-NN), lib_kernels (DORY with lib/gap8/kernels), fused
#             (a fused executor, where one runs the network: host/fused.py); default all
# A GVSOC entry may set the longest simulation (timeout_s, default 1800); a deck
# entry how long to wait for the report after the flash (seconds, default 180).

sets:
  common:
    gvsoc:
      - {networks: [mlp_fits_l2, custom_cnns], memory: [l2]}
      - {networks: [mobilenetv1-a025-c8to256-out1000, resnet18-c8to64-out1000], inputs: [160x120c1], memory: [l3]}
    aideck:
      - {networks: [mlp-12to256to256to4], memory: [l2, l3]}
      - {networks: [convpool-160x96c1-c8s2mp-c16mp-c32mp-c32-out4, dwpw-24x24c16-c32mp-c64mp-c96mp-out4],
         memory: [l2]}
      - {networks: [mobilenetv1-a025-c8to256-out1000, resnet18-c8to64-out1000], inputs: [160x120c1], memory: [l3]}

  exhaustive:
    gvsoc:
      - {networks: [mlp_fits_l2, custom_cnns], memory: [l2, l3]}
      - {networks: [mlp_needs_l3, mlp-12to2560to2560to4], memory: [l3], timeout_s: 10800}
      - {networks: [mobilenetv1_widths, resnet18_widths], inputs: [160x120c1, 320x240c1], memory: [l3],
         timeout_s: 7200}
      - {networks: [resnet18-c28to224-out1000], inputs: [160x120c1], memory: [l3], timeout_s: 7200}
    aideck:
      - {networks: [mlp_fits_l2, custom_cnns], memory: [l2, l3]}
      - {networks: [mlp_needs_l3, mlp-12to2560to2560to4], memory: [l3]}
      - {networks: [mobilenetv1_widths, resnet18_widths], inputs: [160x120c1, 320x240c1], memory: [l3]}
      - {networks: [resnet18-c28to224-out1000], inputs: [160x120c1], memory: [l3]}
